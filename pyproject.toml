[project]
name = "nexus-ai"
version = "0.1.0"
description = "API de assistente inteligente do Nexus_IA, preparada para RAG."
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Guilherme" }
]
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "langchain",
    "langchain-groq",
    "langgraph",
    "pydantic",
    "python-dotenv",
    "Pillow",
    "pytesseract",
    "pdf2image",
    "beautifulsoup4",
    "python-pptx",
    "openpyxl",
    "python-docx",
    "pypdf",
]

[project.scripts]
nexus-ai = "nexus_ai:main"

[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
include = ["nexus_ai*", "agents*"]

[dependency-groups]
dev = [
    "pytest",
    "httpx",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
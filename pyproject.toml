[project]
name = "nexus-ai"
version = "0.1.0"
description = "Assistente de IA com RAG sobre a documentação do Nexus_IA: API, chat web e rotinas de manutenção."
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Guilherme" }
]
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "langchain",
    "langchain-groq",
    "langgraph",
    "pydantic",
    "python-dotenv",
    "Pillow",
    "pytesseract",
    "pdf2image",
    "beautifulsoup4",
    "python-pptx",
    "openpyxl",
    "python-docx",
    "pypdf",
    "chromadb>=1.5.9",
    "sentence-transformers>=6.2.0",
    # Declarado direto só para o uv aplicar o índice CPU abaixo.
    "torch",
]

[project.optional-dependencies]
# Vault e Object Storage, usados no deploy na OCI.
oci = ["oci"]

[project.scripts]
nexus-ai = "nexus_ai:main"

[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
include = ["nexus_ai*", "agents*", "processing*", "maintenance*"]

[tool.setuptools.package-data]
nexus_ai = ["web/*"]

[dependency-groups]
dev = [
    "pytest",
    "httpx",
]

# No Linux (container e CI), o PyTorch vem só com CPU: sem os pacotes CUDA,
# que deixariam a imagem com vários GB a mais.
[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
